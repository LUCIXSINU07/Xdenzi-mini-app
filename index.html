<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>XDENZI • Neon Mini App</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
min-height:100vh;
font-family:Arial,sans-serif;
color:#fff;
overflow-x:hidden;
background:
radial-gradient(circle at 15% 10%,rgba(190,0,255,.20),transparent 28%),
radial-gradient(circle at 85% 80%,rgba(0,220,255,.15),transparent 30%),
linear-gradient(145deg,#030308,#0b0614 48%,#03151b);
}

.app{
width:min(680px,100%);
margin:auto;
padding:28px 18px 35px
}

.header{
text-align:center;
margin-bottom:20px
}

.logo{
font-size:34px;
font-weight:900;
letter-spacing:9px;
text-shadow:0 0 8px #c000ff,0 0 28px #8500ff
}

.sub{
margin-top:7px;
color:#a7a3b0;
font-size:13px;
letter-spacing:4px
}

.card{
background:linear-gradient(145deg,rgba(16,10,30,.97),rgba(5,14,22,.97));
border:1px solid rgba(175,0,255,.48);
border-radius:24px;
padding:18px;
box-shadow:
0 0 30px rgba(130,0,255,.15),
inset 0 0 25px rgba(0,210,255,.035)
}

.profile{
display:flex;
align-items:center;
gap:14px
}

.avatar{
width:68px;
height:68px;
border-radius:50%;
display:grid;
place-items:center;
background:#050505;
border:2px solid #b000ff;
box-shadow:0 0 18px #7200ff;
overflow:hidden;
font-size:21px;
font-weight:900
}

.avatar img{
width:100%;
height:100%;
object-fit:cover;
display:none
}

.name{
font-size:21px;
font-weight:900
}

.role{
margin-top:5px;
color:#00eaff;
font-size:11px;
letter-spacing:2px
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-top:18px
}

.stat{
padding:17px 7px;
text-align:center;
border-radius:17px;
background:#070a12;
border:1px solid rgba(0,210,255,.10)
}

.num{
font-size:24px;
font-weight:900;
color:#00eaff;
text-shadow:0 0 12px #00cfff
}

.label{
margin-top:5px;
color:#777;
font-size:9px;
letter-spacing:2px
}

.video-box{
margin-top:18px;
padding:10px;
border-radius:20px;
background:#05050a;
border:1px solid #9d00ff;
box-shadow:0 0 22px rgba(140,0,255,.20)
}

video{
width:100%;
display:block;
aspect-ratio:16/9;
object-fit:cover;
border-radius:14px;
background:#000
}

.video-title{
padding:12px 4px 3px;
color:#00eaff;
font-size:12px;
font-weight:900;
letter-spacing:2px
}

.profile-line{
margin-top:14px;
padding:15px;
border-radius:16px;
background:#080b13;
border:1px solid rgba(174,0,255,.38);
display:flex;
align-items:center;
gap:10px
}

.pname{
font-weight:800
}

.username{
color:#aaa;
font-size:12px;
margin-top:3px
}

button{
width:100%;
margin-top:13px;
padding:17px;
border:0;
border-radius:18px;
color:#fff;
font-weight:900;
font-size:16px;
letter-spacing:2px;
background:linear-gradient(90deg,#7600ff,#d000ff);
box-shadow:0 0 22px rgba(185,0,255,.35)
}

button.secondary{
background:linear-gradient(90deg,#101323,#15172a);
border:1px solid rgba(0,220,255,.18);
box-shadow:none
}

.footer{
text-align:center;
color:#666;
font-size:10px;
margin-top:20px;
letter-spacing:1px
}
</style>
</head>

<body>

<main class="app">

<header class="header">
<div class="logo">XDENZI</div>
<div class="sub">NEON TELEGRAM MINI APP</div>
</header>

<section class="card">

<div class="profile">

<div class="avatar" id="avatar">
<img id="profilePhoto" alt="Telegram profile">
<span id="fallback">XD</span>
</div>

<div>
<div class="name" id="displayName">XDENZI</div>
<div class="role">● SECURE INTERFACE</div>
</div>

</div>

<div class="stats">

<div class="stat">
<div class="num">52</div>
<div class="label">VIEWS</div>
</div>

<div class="stat">
<div class="num">99%</div>
<div class="label">UPTIME</div>
</div>

<div class="stat">
<div class="num">LIVE</div>
<div class="label">SERVER</div>
</div>

</div>

<div class="video-box">

<video id="video" controls playsinline preload="metadata">

<source src="xdenzi.mp4" type="video/mp4">

Your browser does not support video.

</video>

<div class="video-title">
▶ XDENZI MUSIC / VIDEO
</div>

</div>

<div class="profile-line">

<span>👤</span>

<div>

<div class="pname" id="tgName">
Telegram User
</div>

<div class="username" id="tgUsername">
@guest
</div>

</div>

</div>

<button id="playBtn">
🎵 PLAY VIDEO / MUSIC
</button>

<button class="secondary" onclick="launch()">
🚀 LAUNCH MINI APP
</button>

<button class="secondary" onclick="about()">
ℹ️ ABOUT
</button>

</section>

<div class="footer">
XDENZI • NEON UI • BLACK / PURPLE / CYAN
</div>

</main>

<script>

const tg=window.Telegram?.WebApp;

if(tg){

tg.ready();
tg.expand();

const u=tg.initDataUnsafe?.user;

if(u){

const full=[
u.first_name,
u.last_name
].filter(Boolean).join(" ");

document.getElementById("tgName").textContent=
full || "Telegram User";

document.getElementById("tgUsername").textContent=
u.username ? "@"+u.username : "@guest";

document.getElementById("displayName").textContent=
full || "XDENZI";

if(u.photo_url){

const img=document.getElementById("profilePhoto");

img.onload=()=>{
img.style.display="block";
document.getElementById("fallback").style.display="none";
};

img.onerror=()=>{
img.style.display="none";
document.getElementById("fallback").style.display="block";
};

img.src=u.photo_url;

}

}

}

const video=document.getElementById("video");

const playBtn=document.getElementById("playBtn");

playBtn.addEventListener("click",()=>{

if(video.paused){

video.play().catch(()=>{});

playBtn.textContent=
"⏸ PAUSE VIDEO / MUSIC";

}else{

video.pause();

playBtn.textContent=
"🎵 PLAY VIDEO / MUSIC";

}

});

video.addEventListener("play",()=>{
playBtn.textContent=
"⏸ PAUSE VIDEO / MUSIC";
});

video.addEventListener("pause",()=>{
playBtn.textContent=
"🎵 PLAY VIDEO / MUSIC";
});

function launch(){

if(tg?.HapticFeedback)
tg.HapticFeedback.impactOccurred("light");

alert("XDENZI Mini App launched!");

}

function about(){

alert(
"XDENZI Neon Mini App\nVideo + Telegram profile integration."
);

}

</script>

</body>
</html>
